name: RAH CI

on:
  push:
    branches: [main, cf-to-echo-cloud]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      action:
        description: Validation only or controlled production deploy
        required: true
        default: validate
        type: choice
        options:
          - validate
          - deploy
      confirmation:
        description: Type DEPLOY_RAH_PRODUCTION to authorize production deploy
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: rah-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/rah_ci
  DIRECT_URL: postgresql://postgres:postgres@localhost:5432/rah_ci
  FIREBASE_PROJECT_ID: echo-prime-ai
  FIREBASE_STORAGE_BUCKET: echo-prime-ai.appspot.com
  NEXT_PUBLIC_FIREBASE_API_KEY: ci-placeholder-api-key
  NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: echo-prime-ai.firebaseapp.com
  NEXT_PUBLIC_FIREBASE_PROJECT_ID: echo-prime-ai
  NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: echo-prime-ai.appspot.com
  NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: '000000000000'
  NEXT_PUBLIC_FIREBASE_APP_ID: 1:000000000000:web:ci-placeholder
  NEXT_PUBLIC_API_URL: https://api.rah-midland.com

jobs:
  validate:
    name: Validate source and builds
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      # setup-node resolves the pnpm store while configuring its cache, so the
      # executable must exist before setup-node runs. The previous order failed
      # every job at setup-node before a single project check could start.
      - name: Install repository-pinned pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Verify pinned pnpm
        run: pnpm --version

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      # Fails the build if any API route regains a handler with no session
      # guard and no alternative control. Added after an audit found only
      # 19 of 103 routes guarded, which is what let a middleware bug expose
      # live guest PII -- this stops the coverage silently eroding again.
      - name: RBAC route coverage gate
        run: python tools/rbac_coverage_audit.py --strict

      - name: Web unit tests
        working-directory: apps/web
        run: pnpm exec vitest run --config vitest.config.ts

      - name: Install focused backend test dependencies
        run: >-
          python -m pip install
          pytest==7.4.4
          python-dateutil==2.8.2
          psycopg2-binary==2.9.9
          httpx==0.26.0
          icalendar==5.0.11

      - name: Run P0 static assertions
        run: node tools/p0_static_assertions.mjs

      - name: Compile backend Python
        run: python -m compileall -q backend

      - name: Test Vrbo MailBridge
        env:
          PYTHONPATH: backend/services
        run: >-
          python -m pytest
          backend/tests/test_vrbo_mail_parser.py
          backend/tests/test_vrbo_reconcile.py
          backend/tests/test_vrbo_ical_evidence.py
          -q

      - name: Validate Prisma schema
        working-directory: apps/web
        run: pnpm exec prisma validate

      - name: Generate Prisma client
        working-directory: apps/web
        run: pnpm exec prisma generate

      - name: Typecheck web
        run: pnpm --dir apps/web exec tsc --noEmit

      - name: Build mobile workspace dependencies
        run: pnpm --filter @rightathome/shared build

      - name: Typecheck mobile
        run: pnpm --dir apps/mobile exec tsc --noEmit

      - name: Build web
        working-directory: apps/web
        env:
          SKIP_PRISMA: 'true'
        run: pnpm build

      - name: Run workspace tests
        run: pnpm test

  deploy-production:
    name: Controlled production deployment
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'deploy'
    needs: validate
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Validate Commander confirmation
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        shell: bash
        run: |
          if [[ "$CONFIRMATION" != "DEPLOY_RAH_PRODUCTION" ]]; then
            echo "Production confirmation token is invalid."
            exit 1
          fi

      - name: Check out exact validated commit
        uses: actions/checkout@v4

      - name: Install repository-pinned pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Verify pinned pnpm
        run: pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Re-run deployment assertions
        run: node tools/p0_static_assertions.mjs

      - name: Verify required production secrets are present
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        shell: bash
        run: |
          test -n "$VERCEL_TOKEN" || { echo "VERCEL_TOKEN is missing"; exit 1; }
          test -n "$FIREBASE_SERVICE_ACCOUNT" || { echo "FIREBASE_SERVICE_ACCOUNT is missing"; exit 1; }

      - name: Deploy exact commit to Vercel production
        working-directory: apps/web
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: pnpm dlx vercel@latest deploy --prod --yes --token="$VERCEL_TOKEN"

      - name: Verify production health
        shell: bash
        run: |
          curl --fail --silent --show-error --retry 5 --retry-delay 5 \
            https://rah-midland.com/api/health \
            --output rah-health.json
          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path('rah-health.json').read_text())
          assert data.get('status') == 'healthy', data
          firebase = data.get('services', {}).get('firebase', {})
          # echo-prime-ai is the real, controlled project (fixed 2026-07-30,
          # commit c442be3). This job curls the LIVE endpoint, so asserting the
          # old rightathome-prod value here would fail against a healthy prod.
          assert firebase.get('expectedProjectId') == 'echo-prime-ai', firebase
          assert firebase.get('configuredProjectId') == 'echo-prime-ai', firebase
          assert firebase.get('projectMatches') is True, firebase
          assert firebase.get('clientConfigured') is True, firebase
          assert firebase.get('adminInitialized') is True, firebase
          print('PRODUCTION_HEALTH_GREEN')
          PY
